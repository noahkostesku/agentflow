<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>agentflow orbit view mockup</title>
<style>body{margin:0;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:"GeistMono Nerd Font","Geist Mono",ui-monospace,Menlo,monospace}
pre{margin:0;background:#0a0a0a;border-radius:8px;padding:14px 16px;font-family:inherit;font-size:13px;line-height:1.5;color:#b3b3b3;white-space:pre;min-height:36em}
button{margin:10px 4px 0;background:none;border:1px solid #2a2a2a;color:#737373;padding:4px 12px;border-radius:6px;font-family:inherit;cursor:pointer}</style></head>
<body>
<!--
REFERENCE MOCKUP: agentflow "orbit" view (cycled with `v`: tree -> orbit -> timeline).
This browser version is a visual spec, not the real tool. Port layout, palette, glyphs and
timings to the terminal renderer. All times are in ms within a 12.5s scripted loop.

WHY EACH ELEMENT EXISTS (keep it useful, not just pretty):
- spokes + packets: show dispatch and return between the orchestrator and each agent (who is waiting on whom)
- peer chords: show real handoffs (one agent's result fed into another agent's task), so data flow is visible
- validator gate: a configured checker role (e.g. test-runner, reviewer) whose verdict shows as pass/fail
- braille trace under each agent: progress at a glance
- "latest" line: the most recent handoff/result, for when you glance over mid-run

PALETTE (matches noahkostesku.com):
  mauve #c4a5b4 (accent) | light mauve #efe2e9 (arrival flash) | bright #e8e8e8 | text #b3b3b3
  muted #737373 | dim #3a3a3a (spokes) | ring #262626 | amber #d4b483 (waiting) | red #d48a8a (fail)

LAYOUT: grid 66x20. Orchestrator at center (33,10). Agents on an ellipse rx=24, ry=8
(~2:1 character aspect ratio), evenly spaced starting at the top. Each agent block is 4 rows:
face (y-1), name (y), status (y+1), 6-cell braille trace (y+2).
Spokes are drawn only over part of the line (u 0.25..0.62, or 0.45..0.62 for agents below the
center) so they never collide with the labels. Draw order: ring -> spokes -> chords -> packets -> labels.
-->
<pre id="ob"></pre>
<div><button id="op">Pause</button><button id="or">Restart</button></div>
<script>
const K={m:'#c4a5b4',ml:'#efe2e9',b:'#e8e8e8',t:'#b3b3b3',mu:'#737373',d:'#3a3a3a',r:'#262626',a:'#d4b483'};
const W=66,H=20,cx=33,cy=10,rx=24,ry=8,L=12500,SP='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';
// Scripted demo. act = [start, end] of active work. val = validator role.
const A=[
{n:'scout',ang:-90,act:[1300,4000],tools:['read','grep','glob']},
{n:'researcher',ang:-18,act:[1700,5000],tools:['web_fetch','read']},
{n:'test-runner',ang:54,val:true,act:[9600,10400],tools:['pytest']},
{n:'fixer',ang:126,act:[7600,9000],tools:['edit','bash']},
{n:'reviewer',ang:198,act:[5700,7000],tools:['read','grep']}];
A.forEach(a=>{const r=a.ang*Math.PI/180;a.x=Math.round(cx+rx*Math.cos(r));a.y=Math.round(cy+ry*Math.sin(r));a.us=a.y>cy?.45:.25;a.ue=.62;});
// Packets: [from, to, start, duration, log label, log detail]. -1 = orchestrator.
// Agent->agent packets draw a temporary dotted chord (lit while in flight, fades ~1.5s after).
const P=[[-1,0,800,500,'orchestrator → scout','dispatch'],[-1,1,1200,500,'orchestrator → researcher','dispatch'],[0,-1,4000,500,'scout → orchestrator','result 2.1kb'],[1,-1,5000,500,'researcher → orchestrator','result 4.8kb'],[-1,4,5200,500,'orchestrator → reviewer','dispatch'],[4,3,7000,600,'reviewer → fixer','findings 1.4kb'],[3,2,9000,600,'fixer → test-runner','patch 0.9kb'],[2,-1,10400,600,'test-runner → orchestrator','✓ validated']];
let G;
const clr=()=>{G=[];for(let y=0;y<H;y++){G.push([]);for(let x=0;x<W;x++)G[y].push([' ',K.t])}};
const put=(x,y,s,c)=>{for(let i=0;i<s.length;i++){const xx=x+i;if(y>=0&&y<H&&xx>=0&&xx<W)G[y][xx]=[s[i],c]}};
const putc=(x,y,s,c)=>put(x-Math.floor(s.length/2),y,s,c);
const soft=(x,y,ch,c)=>{if(y>=0&&y<H&&x>=0&&x<W&&G[y][x][0]===' ')G[y][x]=[ch,c]};
const lerp=(F,T,u)=>[Math.round(F[0]+(T[0]-F[0])*u),Math.round(F[1]+(T[1]-F[1])*u)];
const pt=i=>i<0?[cx,cy]:[A[i].x,A[i].y];
function segRange(f,to){if(f<0)return[A[to].us,A[to].ue];if(to<0)return[1-A[f].ue,1-A[f].us];return[.25,.75]}
function frame(t){
clr();
// 1. orbit ring (very dim) + one slow "satellite" dot circling it
for(let k=0;k<160;k++){const r=k/160*2*Math.PI;soft(Math.round(cx+rx*Math.cos(r)),Math.round(cy+ry*Math.sin(r)),'·',K.r)}
const sa=t*0.0006;const sx=Math.round(cx+rx*Math.cos(sa)),sy=Math.round(cy+ry*Math.sin(sa));
if(G[sy]&&G[sy][sx]&&G[sy][sx][0]==='·')G[sy][sx]=['•',K.mu];
// 2. dotted spokes
A.forEach(a=>{for(let u=a.us;u<=a.ue;u+=.02){const[p,q]=lerp([cx,cy],[a.x,a.y],u);soft(p,q,'·',K.d)}});
// 3. peer chords for handoffs
P.forEach(p=>{if(p[0]>=0&&p[1]>=0&&t>=p[2]-200&&t<p[2]+p[3]+1500){const F=pt(p[0]),T=pt(p[1]);const lit=t<p[2]+p[3];for(let u=.25;u<=.75;u+=.025){const[x,y]=lerp(F,T,u);soft(x,y,'·',lit?K.mu:K.d)}}});
// 4. packets: head ● with trail • · behind it
P.forEach(p=>{if(t>=p[2]&&t<p[2]+p[3]){const q=(t-p[2])/p[3];const[s,e]=segRange(p[0],p[1]);const F=pt(p[0]),T=pt(p[1]);
[[q-.16,'·'],[q-.08,'•'],[q,'●']].forEach(([qq,ch])=>{if(qq>=0){const[x,y]=lerp(F,T,s+(e-s)*qq);put(x,y,ch,K.m)}})}});
// 5. orchestrator (happy face for ~900ms whenever a result arrives)
const done=t>=11000;
const arrivedC=P.some(p=>p[1]<0&&t>=p[2]+p[3]&&t<p[2]+p[3]+900);
putc(cx,cy-1,'◆',K.m);
putc(cx,cy,(done||arrivedC)?'(^‿^)':((t%4100)<130?'(-‿-)':'(•‿•)'),(done||arrivedC)?K.m:K.t);
putc(cx,cy+1,'orchestrator',K.b);
putc(cx,cy+2,done?'all done ✓':(t<600?'booting':'delegating '+SP[Math.floor(t/80)%10]),done?K.m:K.mu);
// 6. agents: idle (-‿-) dim -> active (eyes glance, tool + spinner) -> done (^‿^)
//    name flashes light mauve for 220ms when a packet arrives. Validator: "validator" -> "validating ⠹" -> "✓ pass"
A.forEach((a,i)=>{
const act=t>=a.act[0]&&t<a.act[1],fin=t>=a.act[1],idle=t<a.act[0];
const flash=P.some(p=>p[1]===i&&t>=p[2]+p[3]&&t<p[2]+p[3]+220);
let f,fc,s,sc;
if(idle){f='(-‿-)';fc=K.d;s=a.val?'validator':'idle';sc=K.d}
else if(act){f=a.val?'(•_•)':(Math.floor(t/450)%2?'(•_• )':'( •_•)');fc=K.m;const tl=a.tools[Math.floor((t-a.act[0])/900)%a.tools.length];s=(a.val?'validating ':tl+' ')+SP[(Math.floor(t/80)+i)%10];sc=K.t}
else{f='(^‿^)';fc=K.mu;s=(a.val&&t<11800)?'✓ pass':'done ✓';sc=(a.val&&t<11800)?K.m:K.mu}
putc(a.x,a.y-1,f,fc);
putc(a.x,a.y,a.n,flash?K.ml:(act?K.b:K.mu));
putc(a.x,a.y+1,s,sc);
const tot=a.act[1]-a.act[0];const pr=idle?0:fin?1:(t-a.act[0])/tot;const n=Math.round(pr*6);
let tr='';for(let k=0;k<6;k++)tr+=k<n?'⣿':'⣀';
putc(a.x,a.y+2,tr,act?K.m:(fin?K.mu:K.r));
});
// header with view switcher, grid, footer "latest" line
const ev=P.filter(p=>t>=p[2]).map(p=>[p[4],p[5]]);if(done)ev.push(['orchestrator','all agents done ✓']);const last=ev[ev.length-1];
const hdr=[[' agentflow',K.m],[' // orbit'+' '.repeat(W-37),K.mu],['v  tree · ',K.d],['orbit',K.m],[' · timeline',K.d]];
const rule=' '+'─'.repeat(W-1);
let html=hdr.map(([s,c])=>'<span style="color:'+c+'">'+s+'</span>').join('')+'\n<span style="color:'+K.r+'">'+rule+'</span>\n';
html+=G.map(row=>row.map(([ch,c])=>'<span style="color:'+c+'">'+ch+'</span>').join('')).join('\n');
html+='\n<span style="color:'+K.r+'">'+rule+'</span>\n';
if(last)html+='<span style="color:'+K.mu+'"> latest  </span><span style="color:'+K.b+'">'+last[0].padEnd(30)+'</span><span style="color:'+(last[1].indexOf('✓')>=0?K.m:K.t)+'">'+last[1]+'</span>';
document.getElementById('ob').innerHTML=html;}
let st=performance.now(),pa=false,pt0=0;
setInterval(()=>{if(!pa){pt0=(performance.now()-st)%L;frame(pt0)}},50);
document.getElementById('op').onclick=e=>{pa=!pa;if(!pa)st=performance.now()-pt0;e.target.textContent=pa?'Play':'Pause'};
document.getElementById('or').onclick=()=>{st=performance.now();if(pa){pt0=0;frame(0)}};
</script></body></html>
