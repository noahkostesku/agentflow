[package]
name = "agentflow"
version = "0.3.1"
edition = "2021"
description = "One live view of every coding agent you run: a terminal visualizer for Claude Code, Codex and other agent harnesses"
license = "MIT"
repository = "https://github.com/noahkostesku/agentflow"
homepage = "https://github.com/noahkostesku/agentflow"
readme = "README.md"
keywords = ["claude-code", "codex", "tui", "agents", "observability"]
categories = ["command-line-utilities", "development-tools", "visualization"]
# the demo gif (2.4 MB) and release tooling stay on GitHub, out of the crate
exclude = ["agent-flow-vid.gif", ".github/", "dist-workspace.toml"]

[[bin]]
name = "agentflow"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde_json = "1.0"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
