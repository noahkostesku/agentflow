[package]
name = "agentflow"
version = "0.1.0"
edition = "2021"
description = "One live view of every coding agent you run: a terminal visualizer for Claude Code, Codex and other agent harnesses"

[[bin]]
name = "agentflow"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde_json = "1.0"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = true
strip = true
